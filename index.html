. حتى 2 V: مطابق. أكثر من 2 V: Minor. أكثر من 5 V: Major (عطل في النيوترال أو التأريض).","Neutral – earth voltage at the DC system input is within limits (≤ 2 V).":"جهد النيوترال – الأرضي عند دخل نظام DC ضمن الحدود (≤ 2 V).","Read the L1, L2 and L3 input currents on the MCU screen (AC input page). Each rectifier module must be set to a phase so that all three phases carry load.":"اقرأ تيارات الدخل L1 وL2 وL3 على شاشة MCU (صفحة دخل AC). يجب ضبط كل موديول مقوّم على فاز بحيث تحمل الفازات الثلاثة الحمل.","Read the L1, L2 and L3 input currents on the MCU screen. Each rectifier module must be set to a phase so that all three phases carry load.":"اقرأ تيارات الدخل L1 وL2 وL3 على شاشة MCU. يجب ضبط كل موديول مقوّم على فاز بحيث تحمل الفازات الثلاثة الحمل.","Rectifier modules are assigned to phases so all three input phases carry current.":"موديولات المقوّم موزّعة على الفازات بحيث تحمل فازات الدخل الثلاثة تياراً.","All three phases carry current":"الفازات الثلاثة تحمل تياراً","Fewer than 3 modules – not every phase can carry a module":"أقل من 3 موديولات – لا يمكن أن يحمل كل فاز موديولاً","No current shown on any phase – read the MCU under load":"لا يظهر تيار على أي فاز – اقرأ MCU تحت الحمل","Enter the voltage readings (AC input page)":"أدخل قراءات الجهد (صفحة دخل AC)","Enter the CB and cable data (AC input page)":"أدخل بيانات القاطع والكابل (صفحة دخل AC)","Enter the 3 phase currents (AC input page)":"أدخل تيارات الفازات الثلاثة (صفحة دخل AC)","Enter the MCU L1 / L2 / L3 currents (AC input page)":"أدخل تيارات L1 / L2 / L3 من MCU (صفحة دخل AC)","Enter the old DC system manufacturing year":"أدخل سنة تصنيع نظام DC القديم","Answer the conversion kit question":"أجب عن سؤال طقم التحويل","Enter the N – E voltage":"أدخل جهد N – E","Checklist start":"بداية قائمة التحقق","Checklist end":"نهاية قائمة التحقق","Captured automatically. The end time is set when the PDF report is exported with a final result.":"تُسجَّل تلقائياً. يُسجَّل وقت النهاية عند تصدير تقرير PDF بنتيجة نهائية.","Meter readings at the DC system internal main CB":"قراءات العداد عند القاطع الرئيسي الداخلي لنظام DC","220/380V Conversion Kit Installed?":"هل طقم التحويل 220/380V مركّب؟","Does the DC system internal main CB also feed other AC loads (AC cooling unit, fans, lights, sockets)?":"هل يغذّي القاطع الرئيسي الداخلي لنظام DC أحمال AC أخرى (وحدة تكييف AC، مراوح، إنارة، مقابس)؟","Modules need about 220 V. On a 220/127 V site the only approved connection is the 220/380V conversion kit (phase-to-phase). A normal L-N connection gives the modules only 127 V (low output, overload and fire risk). The kit must not be used on a 380/220 V site.":"تحتاج الموديولات إلى نحو 220 V. في موقع 220/127 V التوصيل الوحيد المعتمد هو طقم التحويل 220/380V (طور-طور). التوصيل العادي L-N يغذي الموديولات بـ 127 V (قدرة منخفضة وخطر حمل زائد وحريق). لا يُستخدم الطقم في موقع 380/220 V.","220/380V conversion kit is installed in a visible and accessible place, with its nameplate readable.":"طقم التحويل 220/380V مركّب في مكان ظاهر وسهل الوصول، ولوحة بياناته مقروءة.","Total rectifier output current shown on MCU (A) (load + battery charging)":"إجمالي تيار خرج موديولات المقوّم المعروض على MCU (A) (الحمل + شحن البطاريات)","Input power = 1.732 × L-L voltage × phase current (averages of the meter readings at the DC system internal main CB). Output power = DC output voltage × total rectifier current shown on the MCU. Efficiency = output ÷ input. Spec minimum 95 %, less 3 % meter tolerance: OK from 92 % to 100 %. Below 92 % is information only at light load (below 20 % of module capacity) or when the internal main CB also feeds other AC loads. Above 100 % means the readings do not match.":"قدرة الدخل = 1.732 × جهد L-L × تيار الفاز (متوسط قراءات الجهاز عند القاطع الرئيسي الداخلي لنظام DC). قدرة الخرج = جهد خرج DC × إجمالي تيار موديولات المقوّم المعروض على MCU. الكفاءة = الخرج ÷ الدخل. الحد الأدنى في المواصفات 95 %، ناقص 3 % لدقة الجهاز: مقبول من 92 % إلى 100 %. أقل من 92 % للعلم فقط عند الحمل الخفيف (أقل من 20 % من قدرة الموديولات) أو إذا كان القاطع الرئيسي الداخلي يغذّي أحمال AC أخرى. أعلى من 100 % يعني أن القراءات غير متطابقة.","Enter the DC output voltage and total rectifier current":"أدخل جهد خرج DC وإجمالي تيار موديولات المقوّم","MCU readings (if shown)":"قراءات MCU (إن وُجدت)","MCU – DC output voltage (V) – optional":"MCU – جهد خرج DC (V) – اختياري","MCU – total rectifier output current (A) – optional":"MCU – إجمالي تيار خرج موديولات المقوّم (A) – اختياري","Checked only when the MCU DC output voltage and total rectifier current are entered. Input power = 1.732 × L-L voltage × phase current (meter readings). Output power = DC voltage × total rectifier current. OK from 92 % to 100 %.":"يُفحص فقط عند إدخال جهد خرج DC وإجمالي تيار موديولات المقوّم من MCU. قدرة الدخل = 1.732 × جهد L-L × تيار الفاز (قراءات الجهاز). قدرة الخرج = جهد DC × إجمالي تيار موديولات المقوّم. مقبول من 92 % إلى 100 %.","Enter the L-L voltages and phase currents (AC input page)":"أدخل جهود L-L وتيارات الفازات (صفحة دخل AC)","Enter the MCU DC output voltage and total rectifier current (AC input page)":"أدخل جهد خرج DC وإجمالي تيار موديولات المقوّم من MCU (صفحة دخل AC)","Answer the other AC loads question (AC input page)":"أجب عن سؤال أحمال AC الأخرى (صفحة دخل AC)","No AC current measured – take the readings under load":"لا يوجد تيار AC مُقاس – خذ القراءات تحت الحمل","Job / WO number":"رقم العمل / أمر العمل (WO)","Complete the required items on this page first":"أكمل البنود المطلوبة في هذه الصفحة أولاً","Type the values shown on the MCU and take the photos now. The battery rows show PASS / FAIL after you fill the Batteries page.":"اكتب القيم الظاهرة على MCU والتقط الصور الآن. صفوف البطاريات تظهر «مطابق / غير مطابق» بعد تعبئة صفحة البطاريات.","Could not save – phone storage is full. Save a backup file, free some space, then continue.":"تعذر الحفظ – ذاكرة الهاتف ممتلئة. احفظ ملف نسخة احتياطية، وفرّغ بعض المساحة، ثم أكمل.","AC input power and DC output power readings match (efficiency 92 – 100 %).":"قراءات قدرة دخل AC وقدرة خرج DC متطابقة (الكفاءة من 92 إلى 100 %).","Photos and videos are allowed at this site.":"التصوير (صور وفيديو) مسموح في هذا الموقع.","The site has lightning protection and grounding that match its lightning risk.":"في الموقع حماية من الصواعق وتأريض يناسبان خطر الصواعق فيه.","The DC system is not inside a telecom ODU, unless that ODU is approved for it.":"نظام DC ليس داخل ODU الاتصالات، إلا إذا كانت هذه الـ ODU معتمدة له.","% of Ah":"% من Ah","External alarm":"الإنذار الخارجي","(from battery register)":"(من سجل البطاريات)","from battery register":"من سجل البطاريات","Mixed (mostly Li-Ion)":"مختلط (غالبيتها Li-Ion)","Mixed (mostly VRLA)":"مختلط (غالبيتها VRLA)","0.2 × total Ah":"0.2 × إجمالي Ah","of total Ah":"من إجمالي Ah","Battery black box size":"حجم صندوق البطاريات (Black box)","4-string black box":"صندوق لـ 4 بطاريات (4-string)","8-string black box":"صندوق لـ 8 بطاريات (8-string)","The black box is an approved model for its size.":"صندوق البطاريات من موديل معتمد لحجمه.","4-string boxes: FENDA, IMAN, MASART, Dr-CUBE SAFE. 8-string boxes: OSOOL VTX-BB-PRO-8R only (other 8-string brands are still under approval).":"صناديق 4 بطاريات: FENDA وIMAN وMASART وDr-CUBE SAFE. صناديق 8 بطاريات: OSOOL VTX-BB-PRO-8R فقط (باقي الماركات ما زالت تحت الاعتماد).","The nameplate shows the approved model and the box size matches it (OSOOL 8-string: 1600 mm high plus a 150 mm base, 600 mm wide, 670 mm deep).":"لوحة البيانات تُظهر الموديل المعتمد ومقاس الصندوق مطابق له (OSOOL لـ 8 بطاريات: ارتفاع 1600 mm مع قاعدة 150 mm، عرض 600 mm، عمق 670 mm).","The nameplate shows the approved black box model.":"لوحة البيانات تُظهر موديل الصندوق المعتمد.","The door closes and all 5 locking points engage (3 left, 1 top, 1 bottom), and the lock works.":"الباب يُغلق وتعمل نقاط القفل الخمس كلها (3 يسار، 1 أعلى، 1 أسفل)، والقفل يعمل.","The black box is anchored to the shelter floor, and the anchors cannot be removed from outside.":"الصندوق مثبّت في أرضية الشلتر، ولا يمكن فك التثبيت من الخارج.","No holes are cut or drilled in the black box. Cables pass only through the factory cable holes, with grommets.":"لا توجد فتحات مقطوعة أو مثقوبة في الصندوق. الكابلات تمر فقط من فتحات الكابلات الأصلية مع جرومت.","Vent holes on both sides and the back are not blocked, and at least 10 cm is kept free at both sides and the back.":"فتحات التهوية على الجانبين والخلف غير مسدودة، وتُترك مسافة 10 cm على الأقل فارغة على الجانبين والخلف.","No more than 8 batteries in the 8-string black box, one battery per shelf.":"لا يزيد عدد البطاريات عن 8 في صندوق الـ 8 بطاريات، بطارية واحدة لكل رف.","No more than 4 batteries in each 4-string black box, one battery per shelf.":"لا يزيد عدد البطاريات عن 4 في كل صندوق 4 بطاريات، بطارية واحدة لكل رف.","Nothing is placed on top of the 8-string black box.":"لا يوضع أي شيء فوق صندوق الـ 8 بطاريات.","The black box is grounded to the site main grounding busbar with min. 16 mm² cable.":"الصندوق مؤرّض على قضيب التأريض الرئيسي للموقع بكابل 16 mm² على الأقل.","The black box is free of damage, its paint is intact and there is no rust.":"الصندوق سليم بدون أضرار، والدهان سليم، ولا يوجد صدأ.","The black box lock code / keys are handed to the TAWAL Region team (not to the contractor or the MSP), and the factory code is changed.":"رمز قفل الصندوق / مفاتيحه سُلّمت لفريق منطقة TAWAL (وليس للمقاول أو MSP)، وتم تغيير رمز المصنع.","Stamped certificate for the rack / black box coating (galvanizing or powder coating) and its warranty is handed over.":"تم تسليم شهادة مختومة لطلاء الحامل / صندوق البطاريات (جلفنة أو دهان بودرة) وضمانه.","This copy of the checklist is not authorised":"هذه النسخة من قائمة التحقق غير مصرّح بها","Open the checklist only from the official TAWAL link.":"افتح قائمة التحقق من رابط TAWAL الرسمي فقط.","Start recording":"ابدأ التسجيل","Show the installation, then walk out and lock the shelter. Recording stops at 30 s.":"صوّر التركيب، ثم اخرج وأقفل الشلتر. يتوقف التسجيل عند 30 ثانية.","Video recording is not supported on this phone":"تسجيل الفيديو غير physical damage that the time-stamped photos do not disprove only until the first PMR / CMR visit, and at most 2 months after the handover date.":"يحق لـ MSP المطالبة بأي ضرر مادي لا تنفيه الصور المؤرّخة بالوقت حتى أول زيارة PMR / CMR فقط، وبحد أقصى شهرين بعد تاريخ التسليم.","Last day":"آخر يوم","Checklist size":"حجم قائمة التحقق","Warning: this backup file was changed outside the checklist after it was saved.":"تحذير: تم تعديل ملف النسخة الاحتياطية هذا خارج قائمة التحقق بعد حفظه.","I confirm that I am an authorised TAWAL implementation contractor, this is a TAWAL site, and all entries and photos are true.":"أقرّ بأنني مقاول تنفيذ معتمد لدى TAWAL، وأن هذا موقع تابع لـ TAWAL، وأن جميع البيانات والصور صحيحة.","Yes, I confirm":"نعم، أقرّ بذلك","Black box door alarm is reported at the TOC (open the door and confirm with the TOC).":"إنذار باب صندوق البطاريات يصل إلى TOC (افتح الباب وتأكّد مع TOC).","The door alarm goes directly to the TOC; it does not show on the MCU. If the TOC does not receive it (for example a site link problem), answer NOK: it is recorded as an MSP snag and the MSP verifies it when they receive the checklist. No trouble ticket is needed.":"إنذار الباب يذهب مباشرة إلى TOC ولا يظهر على MCU. إذا لم يستلمه TOC (مثلاً بسبب مشكلة في ربط الموقع)، أجب NOK: يُسجَّل كملاحظة على MSP ويتحقق منه MSP عند استلام قائمة التحقق. لا حاجة لفتح تذكرة عطل (TT).","All photos were taken within 100 m of the site location (from the issued WO list).":"جميع الصور التُقطت ضمن 100 m من موقع الموقع (حسب قائمة أوامر العمل الصادرة).","Closing video (max 30 s): the installation, then leaving and locking the shelter":"فيديو الإغلاق (30 ثانية كحد أقصى): التركيب، ثم الخروج وإقفال الشلتر","S/N label photo":"صورة ملصق S/N","Checking the issued WO list":"جارٍ التحقق من قائمة أوامر العمل الصادرة","Not on the issued WO list for this TAWAL ID – contact TAWAL":"غير موجود في قائمة أوامر العمل الصادرة لرقم TAWAL هذا – تواصل مع TAWAL","Does not match the issued WO":"لا يطابق أمر العمل الصادر","Compatible cable already available at MC / district":"كابل متوافق متوفر مسبقاً في MC / القطاع","© 2026 TAWAL. Property of TAWAL – for authorised contractors on TAWAL sites only. Each report records the device, job and time.":"© 2026 TAWAL. ملك لـ TAWAL – للمقاولين المعتمدين في مواقع TAWAL فقط. كل تقرير يسجّل الجهاز ورقم العمل والوقت.",Scope:"نطاق العمل","PAT date":"تاريخ PAT","Filled from the TAWAL critical site list.":"مأخوذ من قائمة المواقع الحرجة لدى TAWAL.","Not on the TAWAL critical site list.":"غير موجود في قائمة المواقع الحرجة لدى TAWAL.","Does not match the TAWAL critical site list":"لا يطابق قائمة المواقع الحرجة لدى TAWAL","The backup matches its saved integrity code. This check does not verify who created or edited it.":"النسخة الاحتياطية تطابق رمز السلامة المحفوظ معها. هذا الفحص لا يثبت من أنشأها أو عدّلها.","Problems in the work of the implementer (the contractor who did this job). They decide the result.":"مشاكل في عمل المنفّذ (المقاول الذي نفّذ هذا العمل). هي التي تحدد النتيجة.","Major = serious defect. Minor = small defect.":"Major = مخالفة جسيمة. Minor = مخالفة بسيطة.","Problems on equipment that was already on site. The MSP (the O&M company) owns them. They do not change the implementer result.":"مشاكل في معدات كانت موجودة مسبقًا في الموقع. مسؤوليتها على MSP (شركة التشغيل والصيانة O&M). لا تغيّر نتيجة المنفّذ.","Filled from the issued WO list.":"مأخوذ من قائمة أوامر العمل الصادرة.","Handover date cannot be in the future":"لا يمكن أن يكون تاريخ التسليم في المستقبل","Serious problem on existing equipment (MSP · Major). It does not change your result, but tell the MSP before you leave the site.":"مشكلة جسيمة في معدات موجودة سابقاً (MSP · Major). لا تغيّر نتيجتك، لكن أبلغ MSP قبل مغادرة الموقع.","Serious problem on existing equipment (MSP · Major) – the MSP must fix it before this handover can close":"مشكلة جسيمة في معدات موجودة سابقاً (MSP · Major) – يجب أن يصلحها MSP قبل إغلاق هذا التسليم"},ur:{"The DC system size is allowed in an outdoor cabinet (54 kW is not installed in an ODU / ODC).":"DC سسٹم کا سائز آؤٹ ڈور کیبنٹ میں اجازت شدہ ہے (54 kW سسٹم ODU / ODC میں نہیں لگایا جاتا)۔","1 input phase missing":"1 ان پٹ فیز غائب ہے","1 module faulty / missing":"1 ماڈیول خراب / غائب ہے","1 · Upgrade fuse / CB and battery cables":"1 · فیوز / CB اور بیٹری کیبلز اپ گریڈ کریں","2 · Install DCDP or fuse box":"2 · DCDP یا فیوز باکس لگائیں","3 · Connect extra batteries directly to the DC busbar":"3 · اضافی بیٹریاں براہ راست DC بس بار سے جوڑیں","> 1 input phase missing":"> 1 ان پٹ فیز غائب ہیں","> 1 module faulty / missing":"> 1 ماڈیول خراب / غائب ہیں","A uniform 1U (≈ 4.5 cm) gap is kept between batteries.":"بیٹریوں کے درمیان یکساں 1U (≈ 4.5 cm) فاصلہ رکھا گیا ہے۔","AC cable MDB → DC system (4 core Cu XLPE, mm²)":"AC کیبل MDB ← DC سسٹم (4 کور Cu XLPE، mm²)","AC cable glands are fitted and insulated at the MDB and DC system entry.":"AC کیبل گلینڈز MDB اور DC سسٹم کے داخلے پر لگے ہوئے اور انسولیٹڈ ہیں۔","AC input":"AC ان پٹ","AC input high-voltage alarm (V)":"AC ان پٹ ہائی وولٹیج الارم (V)","AC input low-voltage alarm (V)":"AC ان پٹ لو وولٹیج الارم (V)","AC surge protection device is installed and grounded (Class I+II, ≥ 80 kA; ≥ 100 kA for 54 kW).":"AC سرج پروٹیکشن ڈیوائس لگا ہوا ہے اور گراؤنڈ ہے (Class I+II، ≥ 80 kA؛ 54 kW کے لیے ≥ 100 kA)۔",Accepted:"منظور","Accepted with minor OIL":"معمولی OIL کے ساتھ منظور","Active / Major":"فعال / Major","Active / Minor":"فعال / Minor","Add battery":"بیٹری شامل کریں","Add every battery on this DC system: new, existing and removed.":"اس DC سسٹم کی ہر بیٹری شامل کریں: نئی، موجودہ اور ہٹائی گئی۔","Add several identical":"کئی ایک جیسی شامل کریں","Air-conditioning is working and the ambient temperature is within 25 °C ± 5 °C.":"ایئر کنڈیشنر چل رہا ہے اور ماحول کا درجہ حرارت 25 °C ± 5 °C کے اندر ہے۔","Alarms & handover":"الارمز اور حوالگی","All battery fuses / CBs report an external alarm when switched off or removed.":"بیٹری کا ہر فیوز / CB بند کرنے یا نکالنے پر بیرونی الارم دیتا ہے۔","All cables (≤ 2 V)۔","Read the L1, L2 and L3 input currents on the MCU screen (AC input page). Each rectifier module must be set to a phase so that all three phases carry load.":"MCU اسکرین پر L1، L2 اور L3 ان پٹ کرنٹ پڑھیں (AC ان پٹ صفحہ)۔ ہر ریکٹیفائر ماڈیول کو کسی فیز پر سیٹ کرنا ضروری ہے تاکہ تینوں فیز لوڈ اٹھائیں۔","Read the L1, L2 and L3 input currents on the MCU screen. Each rectifier module must be set to a phase so that all three phases carry load.":"MCU اسکرین پر L1، L2 اور L3 ان پٹ کرنٹ پڑھیں۔ ہر ریکٹیفائر ماڈیول کو کسی فیز پر سیٹ کرنا ضروری ہے تاکہ تینوں فیز لوڈ اٹھائیں۔","Rectifier modules are assigned to phases so all three input phases carry current.":"ریکٹیفائر ماڈیولز فیزوں پر اس طرح سیٹ ہیں کہ تینوں ان پٹ فیزوں پر کرنٹ ہے۔","All three phases carry current":"تینوں فیزوں پر کرنٹ ہے","Fewer than 3 modules – not every phase can carry a module":"3 سے کم ماڈیولز – ہر فیز پر ماڈیول نہیں آ سکتا","No current shown on any phase – read the MCU under load":"کسی فیز پر کرنٹ نظر نہیں آ رہا – MCU لوڈ کے ساتھ پڑھیں","Enter the voltage readings (AC input page)":"وولٹیج ریڈنگز لکھیں (AC ان پٹ صفحہ)","Enter the CB and cable data (AC input page)":"CB اور کیبل کا ڈیٹا لکھیں (AC ان پٹ صفحہ)","Enter the 3 phase currents (AC input page)":"تینوں فیز کرنٹ لکھیں (AC ان پٹ صفحہ)","Enter the MCU L1 / L2 / L3 currents (AC input page)":"MCU کے L1 / L2 / L3 کرنٹ لکھیں (AC ان پٹ صفحہ)","Enter the old DC system manufacturing year":"پرانے DC سسٹم کا تیاری کا سال لکھیں","Answer the conversion kit question":"کنورژن کٹ والے سوال کا جواب دیں","Enter the N – E voltage":"N – E وولٹیج لکھیں","Checklist start":"چیک لسٹ شروع","Checklist end":"چیک لسٹ ختم","Captured automatically. The end time is set when the PDF report is exported with a final result.":"خود بخود ریکارڈ ہوتا ہے۔ ختم ہونے کا وقت تب لگتا ہے جب حتمی نتیجے کے ساتھ PDF رپورٹ ایکسپورٹ ہو۔","Meter readings at the DC system internal main CB":"DC سسٹم کے اندرونی مین CB پر میٹر ریڈنگز","220/380V Conversion Kit Installed?":"کیا 220/380V کنورژن کٹ لگی ہوئی ہے؟","Does the DC system internal main CB also feed other AC loads (AC cooling unit, fans, lights, sockets)?":"کیا DC سسٹم کا اندرونی مین CB دوسرے AC لوڈز کو بھی سپلائی دیتا ہے (AC کولنگ یونٹ، پنکھے، لائٹس، ساکٹس)؟","Modules need about 220 V. On a 220/127 V site the only approved connection is the 220/380V conversion kit (phase-to-phase). A normal L-N connection gives the modules only 127 V (low output, overload and fire risk). The kit must not be used on a 380/220 V site.":"ماڈیولز کو تقریباً 220 V چاہیے۔ 220/127 V سائٹ پر واحد منظور شدہ کنکشن 220/380V کنورژن کٹ (فیز ٹو فیز) ہے۔ عام L-N کنکشن ماڈیولز کو 127 V دیتا ہے (کم پاور، اوورلوڈ اور آگ کا خطرہ)۔ 380/220 V سائٹ پر کٹ استعمال نہ کریں۔","220/380V conversion kit is installed in a visible and accessible place, with its nameplate readable.":"220/380V کنورژن کٹ نظر آنے والی اور قابل رسائی جگہ پر لگی ہے، اور اس کی نیم پلیٹ پڑھی جا سکتی ہے۔","Total rectifier output current shown on MCU (A) (load + battery charging)":"MCU پر دکھایا گیا ریکٹیفائرز کا کل آؤٹ پٹ کرنٹ (A) (لوڈ + بیٹری چارجنگ)","Input power = 1.732 × L-L voltage × phase current (averages of the meter readings at the DC system internal main CB). Output power = DC output voltage × total rectifier current shown on the MCU. Efficiency = output ÷ input. Spec minimum 95 %, less 3 % meter tolerance: OK from 92 % to 100 %. Below 92 % is information only at light load (below 20 % of module capacity) or when the internal main CB also feeds other AC loads. Above 100 % means the readings do not match.":"ان پٹ پاور = 1.732 × L-L وولٹیج × فیز کرنٹ (DC سسٹم کے اندرونی مین CB پر میٹر ریڈنگز کی اوسط)۔ آؤٹ پٹ پاور = DC آؤٹ پٹ وولٹیج × MCU پر دکھایا گیا ریکٹیفائرز کا کل کرنٹ۔ ایفیشینسی = آؤٹ پٹ ÷ ان پٹ۔ اسپیک کی کم از کم حد 95 %، میٹر کی درستگی کے لیے 3 % کم: 92 % سے 100 % تک OK۔ 92 % سے کم صرف معلومات ہے اگر لوڈ ہلکا ہو (ماڈیولز کی گنجائش کے 20 % سے کم) یا اندرونی مین CB دوسرے AC لوڈز کو بھی سپلائی دیتا ہو۔ 100 % سے زیادہ کا مطلب ہے کہ ریڈنگز آپس میں نہیں ملتیں۔","Enter the DC output voltage and total rectifier current":"DC آؤٹ پٹ وولٹیج اور ریکٹیفائرز کا کل کرنٹ درج کریں","MCU readings (if shown)":"MCU ریڈنگز (اگر دکھائی دیں)","MCU – DC output voltage (V) – optional":"MCU – DC آؤٹ پٹ وولٹیج (V) – اختیاری","MCU – total rectifier output current (A) – optional":"MCU – ریکٹیفائرز کا کل آؤٹ پٹ کرنٹ (A) – اختیاری","Checked only when the MCU DC output voltage and total rectifier current are entered. Input power = 1.732 × L-L voltage × phase current (meter readings). Output power = DC voltage × total rectifier current. OK from 92 % to 100 %.":"صرف تب چیک ہوتا ہے جب MCU کا DC آؤٹ پٹ وولٹیج اور ریکٹیفائرز کا کل کرنٹ درج ہو۔ ان پٹ پاور = 1.732 × L-L وولٹیج × فیز کرنٹ (میٹر ریڈنگز)۔ آؤٹ پٹ پاور = DC وولٹیج × ریکٹیفائرز کا کل کرنٹ۔ 92 % سے 100 % تک OK۔","Enter the L-L voltages and phase currents (AC input page)":"L-L وولٹیج اور فیز کرنٹس درج کریں (AC ان پٹ صفحہ)","Enter the MCU DC output voltage and total rectifier current (AC input page)":"MCU کا DC آؤٹ پٹ وولٹیج اور ریکٹیفائرز کا کل کرنٹ درج کریں (AC ان پٹ صفحہ)","Answer the other AC loads question (AC input page)":"دوسرے AC لوڈز والے سوال کا جواب دیں (AC ان پٹ صفحہ)","No AC current measured – take the readings under load":"کوئی AC کرنٹ نہیں ناپا گیا – ریڈنگز لوڈ کے دوران لیں","Job / WO number":"جاب / WO نمبر","Complete the required items on this page first":"پہلے اس صفحے کے ضروری آئٹمز مکمل کریں","Type the values shown on the MCU and take the photos now. The battery rows show PASS / FAIL after you fill the Batteries page.":"MCU پر نظر آنے والی قدریں ابھی لکھیں اور تصاویر لیں۔ بیٹری والی قطاریں بیٹریاں والا صفحہ بھرنے کے بعد PASS / FAIL دکھائیں گی۔","Could not save – phone storage is full. Save a backup file, free some space, then continue.":"محفوظ نہیں ہو سکا – فون کی اسٹوریج بھری ہوئی ہے۔ بیک اپ فائل محفوظ کریں، کچھ جگہ خالی کریں، پھر کام جاری رکھیں۔","AC input power and DC output power readings match (efficiency 92 – 100 %).":"AC ان پٹ پاور اور DC آؤٹ پٹ پاور کی ریڈنگز آپس میں ملتی ہیں (ایفیشینسی 92 سے 100 % تک)۔","Photos and videos are allowed at this site.":"اس سائٹ پر تصاویر اور ویڈیو لینے کی اجازت ہے۔","The site has lightning protection and grounding that match its lightning risk.":"سائٹ پر آسمانی بجلی سے حفاظت اور گراؤنڈنگ اس کے خطرے کے مطابق موجود ہے۔","The DC system is not inside a telecom ODU, unless that ODU is approved for it.":"DC سسٹم ٹیلیکام ODU کے اندر نہیں ہے، سوائے اس کے کہ وہ ODU اس کے لیے منظور شدہ ہو۔","% of Ah":"Ah کا %","External alarm":"بیرونی الارم","(from battery register)":"(بیٹری رجسٹر سے)","from battery register":"بیٹری رجسٹر سے","Mixed (mostly Li-Ion)":"ملی جلی (زیادہ تر Li-Ion)","Mixed (mostly VRLA)":"ملی جلی (زیادہ تر VRLA)","0.2 × total Ah":"0.2 × کل Ah","of total Ah":"کل Ah کا","Battery black box size":"بیٹری بلیک باکس کا سائز","4-string black box":"4 بیٹریوں والا بلیک باکس (4-string)","8-string black box":"8 بیٹریوں والا بلیک باکس (8-string)","The black box is an approved model for its size.":"بلیک باکس اپنے سائز کے لیے منظور شدہ ماڈل ہے۔","4-string boxes: FENDA, IMAN, MASART, Dr-CUBE SAFE. 8-string boxes: OSOOL VTX-BB-PRO-8R only (other 8-string brands are still under approval).":"4 بیٹریوں والے باکس: FENDA، IMAN، MASART، Dr-CUBE SAFE۔ 8 بیٹریوں والے باکس: صرف OSOOL VTX-BB-PRO-8R (باقی برانڈز ابھی منظوری کے مرحلے میں ہیں)۔","The nameplate shows the approved model and the box size matches it (OSOOL 8-string: 1600 mm high plus a 150 mm base, 600 mm wide, 670 mm deep).":"نیم پلیٹ پر منظور شدہ ماڈل ہے اور باکس کا سائز اس سے ملتا ہے (OSOOL 8 بیٹری: اونچائی 1600 mm اور 150 mm بیس، چوڑائی 600 mm، گہرائی 670 mm)۔","The nameplate shows the approved black box model.":"نیم پلیٹ پر منظور شدہ بلیک باکس ماڈل ہے۔","The door closes and all 5 locking points engage (3 left, 1 top, 1 bottom), and the lock works.":"دروازہ بند ہوتا ہے اور تالے کے پانچوں پوائنٹ لگتے ہیں (3 بائیں، 1 اوپر، 1 نیچے)، اور تالا کام کرتا ہے۔","The black box is anchored to the shelter floor, and the anchors cannot be removed from outside.":"بلیک باکس شیلٹر کے فرش سے پکا لگا ہے، اور اس کے بولٹ باہر سے نہیں کھل سکتے۔","No holes are cut or drilled in the black box. Cables pass only through the factory cable holes, with grommets.":"بلیک باکس میں کوئی سوراخ کاٹا یا ڈرل نہیں کیا گیا۔ کیبلز صرف فیکٹری کے کیبل سوراخوں سے گرومٹ کے ساتھ گزرتی ہیں۔","Vent holes on both sides and the back are not blocked, and at least 10 cm is kept free at both sides and the back.":"دونوں سائیڈوں اور پیچھے کے ہوا کے سوراخ بند نہیں، اور دونوں سائیڈوں اور پیچھے کم از کم 10 cm جگہ خالی ہے۔","No more than 8 batteries in the 8-string black box, one battery per shelf.":"8 بیٹریوں والے بلیک باکس میں 8 سے زیادہ بیٹریاں نہیں، ہر شیلف پر ایک بیٹری۔","No more than 4 batteries in each 4-string black box, one battery per shelf.":"ہر 4 بیٹریوں والے بلیک باکس میں 4 سے زیادہ بیٹریاں نہیں، ہر شیلف پر ایک بیٹری۔","Nothing is placed on top of the 8-string black box.":"8 بیٹریوں والے بلیک باکس کے اوپر کچھ نہیں رکھا گیا۔","The black box is grounded to the site main grounding busbar with min. 16 mm² cable.":"بلیک باکس کم از کم 16 mm² کیبل سے سائٹ کے مین گراؤنڈنگ بس بار سے جڑا ہے۔","The black box is free of damage, its paint is intact and there is no rust.":"بلیک باکس میں کوئی نقصان نہیں، رنگ ٹھیک ہے اور زنگ نہیں۔","The black box lock code / keys are handed to the TAWAL Region team (not to the contractor or the MSP), and the factory code is changed.":"بلیک باکس کے تالے کا کوڈ / چابیاں TAWAL ریجن ٹیم کو دی گئی ہیں (ٹھیکیدار یا MSP کو نہیں)، اور فیکٹری کوڈ بدل دیا گیا ہے۔","Stamped certificate for the rack / black box coating (galvanizing or powder coating) and its warranty is handed over.":"ریک / بلیک باکس کی کوٹنگ (گیلوانائزنگ یا پاؤڈر کوٹنگ) اور اس کی وارنٹی کا مہر لگا سرٹیفکیٹ دیا گیا ہے۔","This copy of the checklist is not authorised":"چیک لسٹ کی یہ کاپی منظور شدہ نہیں ہے","Open the checklist only from the official TAWAL link.":"چیک لسٹ صرف TAWAL کے سرکاری لنک سے کھولیں۔","Start recording":"ریکارڈنگ شروع کریں","Show the installation, then walk out and lock the shelter. Recording stops at 30 s.":"انسٹالیشن دکھائیں، پھر باہر نکلیں اور شیلٹر کو تالا لگائیں۔ ریکارڈنگ 30 سیکنڈ پر رک جاتی ہے۔","Video recording is not supported on this phone":"اس فون پر ویڈیو ریکارڈنگ نہیں ہو سکتی",Stop:"روکیں","The video is too large – record it again":"ویڈیو بہت بڑی ہے – دوبارہ ریکارڈ کریں","Could not read this video":"یہ ویڈیو پڑھی نہیں جا سکی","Video could not be saved – phone storage is full.":"ویڈیو محفوظ نہیں ہو سکی – فون کی میموری بھری ہوئی ہے۔","Video added":"ویڈیو شامل ہو گئی","The video is longer than 30 s – record it again":"ویڈیو 30 سیکنڈ سے لمبی ہے – دوبارہ ریکارڈ کریں","Closing video (max 30 s)":"اختتامی ویڈیو (زیادہ سے زیادہ 30 سیکنڈ)","Record it after the checklist is filled: show the installation, then walk out and lock the shelter.":"چیک لسٹ بھرنے کے بعد ریکارڈ کریں: انسٹالیشن دکھائیں، پھر باہر نکلیں اور شیلٹر کو تالا لگائیں۔","Record again":"دوبارہ ریکارڈ کریں","Record the closing video (required)":"اختتامی ویڈیو ریکارڈ کریں (لازمی)","Photo resolution is too low – take it again with the phone camera":"تصویر کی کوالٹی بہت کم ہے – فون کے کیمرے سے دوبارہ لیں","This photo is already used for another item – take a new photo":"یہ تصویر پہلے ہی کسی اور آئٹم کے لیے استعمال ہو چکی ہے – نئی تصویر لیں","The issued WO list on this phone is out of date. Open the checklist link with internet to update it.":"اس فون پر جاری شدہ WO لسٹ پرانی ہے۔ اسے اپڈیٹ کرنے کے لیے انٹرنیٹ کے ساتھ چیک لسٹ کا لنک کھولیں۔","Job / WO number found on the issued WO list.":"جاب / WO نمبر جاری شدہ WO لسٹ میں موجود ہے۔","This Job / WO number and TAWAL ID are not on the issued WO list. Check both numbers. If they are correct, contact TAWAL.":"یہ جاب / WO نمبر اور TAWAL ID جاری شدہ WO لسٹ میں نہیں ہیں۔ دونوں نمبر چیک کریں۔ اگر درست ہیں تو TAWAL سے رابطہ کریں۔",Declaration:"اقرار نامہ",Submission:"جمع کروانا","Upload the PDF report, the backup file and the supporting documents to the TAWAL shared folder within 24 hours of closing the checklist.":"چیک لسٹ بند کرنے کے 24 گھنٹوں کے اندر PDF رپورٹ، بیک اپ فائل اور معاون دستاویزات TAWAL کے شیئرڈ فولڈر میں اپلوڈ کریں۔",Deadline:"آخری وقت","The MSP checks and signs the checklist within 24 hours of the upload.":"MSP اپلوڈ کے 24 گھنٹوں کے اندر چیک لسٹ چیک کر کے دستخط کرتا ہے۔","The MSP can claim physical damage that the time-stamped photos do not disprove only until the first PMR / CMR visit, and at most 2 months after the handover date.":"MSP ایسے جسمانی نقصان کا دعویٰ، جسے ٹائم اسٹیمپ والی تصاویر غلط ثابت نہ کریں، صرف پہلے PMR / CMR وزٹ تک اور ہینڈ اوور کی تاریخ کے زیادہ سے زیادہ 2 مہینے بعد تک کر سکتا ہے۔","Last day":"آخری دن","Checklist size":"چیک لسٹ کا سائز","Warning: this backup file was changed outside the checklist after it was saved.":"انتباہ: اس بیک اپ فائل کو محفوظ کرنے کے بعد چیک لسٹ سے باہر تبدیل کیا گیا ہے۔","I confirm that I am an authorised TAWAL implementation contractor, this is a TAWAL site, and all entries and photos are true.":"میں تصدیق کرتا ہوں کہ میں TAWAL کا منظور شدہ عمل درآمد ٹھیکیدار ہوں، یہ TAWAL کی سائٹ ہے، اور تمام اندراجات اور تصاویر درست ہیں۔","Yes, I confirm":"جی ہاں، میں تصدیق کرتا ہوں","Black box door alarm is reported at the TOC (open the door and confirm with the TOC).":"بلیک باکس کے دروازے کا الارم TOC پر آتا ہے (دروازہ کھولیں اور TOC سے تصدیق کریں)۔","The door alarm goes directly to the TOC; it does not show on the MCU. If the TOC does not receive it (for example a site link problem), answer NOK: it is recorded as an MSP snag and the MSP verifies it when they receive the checklist. No trouble ticket is needed.":"دروازے کا الارم سیدھا TOC کو جاتا ہے؛ یہ MCU پر نظر نہیں آتا۔ اگر TOC کو نہ ملے (مثلاً سائٹ لنک کا مسئلہ)، تو NOK جواب دیں: یہ MSP کے ذمے نوٹ ہوتا ہے اور MSP چیک لسٹ ملنے پر اس کی تصدیق کرتا ہے۔ ٹربل ٹکٹ (TT) کی ضرورت نہیں۔","All photos were taken within 100 m of the site location (from the issued WO list).":"تمام تصاویر سائٹ کی لوکیشن سے 100 m کے اندر لی گئیں (جاری شدہ WO لسٹ کے مطابق)۔","Closing video (max 30 s): the installation, then leaving and locking the shelter":"اختتامی ویڈیو (زیادہ سے زیادہ 30 سیکنڈ): انسٹالیشن، پھر باہر نکلنا اور شیلٹر کو تالا لگانا","S/N label photo":"S/N لیبل کی تصویر","Checking the issued WO list":"جاری شدہ WO لسٹ چیک ہو رہی ہے","Not on the issued WO list for this TAWAL ID – contact TAWAL":"اس TAWAL ID کے لیے جاری شدہ WO لسٹ میں نہیں – TAWAL سے رابطہ کریں","Does not match the issued WO":"جاری شدہ WO سے نہیں ملتا","Compatible cable already available at MC / district":"مطابقت رکھنے والی کیبل پہلے سے MC / ڈسٹرکٹ میں موجود ہے","© 2026 TAWAL. Property of TAWAL – for authorised contractors on TAWAL sites only. Each report records the device, job and time.":"© 2026 TAWAL. TAWAL کی ملکیت – صرف TAWAL سائٹس پر منظور شدہ ٹھیکیداروں کے لیے۔ ہر رپورٹ میں ڈیوائس، جاب اور وقت درج ہوتا ہے۔",Scope:"کام کا دائرہ","PAT date":"PAT کی تاریخ","Filled from the TAWAL critical site list.":"TAWAL کی اہم سائٹس کی لسٹ سے بھرا گیا۔","Not on the TAWAL critical site list.":"TAWAL کی اہم سائٹس کی لسٹ میں نہیں۔","Does not match the TAWAL critical site list":"TAWAL کی اہم سائٹس کی لسٹ سے نہیں ملتا","The backup matches its saved integrity code. This check does not verify who created or edited it.":"بیک اپ اپنے محفوظ کردہ integrity کوڈ سے ملتا ہے۔ یہ چیک یہ ثابت نہیں کرتا کہ اسے کس نے بنایا یا بدلا۔","Problems in the work of the implementer (the contractor who did this job). They decide the result.":"کام کرنے والے (وہ ٹھیکیدار جس نے یہ کام کیا) کے کام میں خامیاں۔ نتیجہ انہی سے طے ہوتا ہے۔","Major = serious defect. Minor = small defect.":"Major = سنگین خامی۔ Minor = معمولی خامی۔","Problems on equipment that was already on site. The MSP (the O&M company) owns them. They do not change the implementer result.":"سائٹ پر پہلے سے موجود سامان کی خامیاں۔ ان کی ذمہ داری MSP (O&M کمپنی) کی ہے۔ یہ کام کرنے والے کے نتیجے کو نہیں بدلتیں۔","Filled from the issued WO list.":"جاری شدہ WO فہرست سے بھرا گیا۔","Handover date cannot be in the future":"حوالگی کی تاریخ آئندہ کی نہیں ہو سکتی","Serious problem on existing equipment (MSP · Major). It does not change your result, but tell the MSP before you leave the site.":"پہلے سے موجود سامان میں سنگین خامی (MSP · Major)۔ یہ آپ کا نتیجہ نہیں بدلتی، لیکن سائٹ چھوڑنے سے پہلے MSP کو بتائیں۔","Serious problem on existing equipment (MSP · Major) – the MSP must fix it before this handover can close":"پہلے سے موجود سامان میں سنگین خامی (MSP · Major) – یہ حوالگی بند ہونے سے پہلے MSP اسے ٹھیک کرے"},hi:{"The DC system size is allowed in an outdoor cabinet (54 kW is not installed in an ODU / ODC).":"DC सिस्टम का आकार आउटडोर कैबिनेट में अनुमत है (54 kW सिस्टम ODU / ODC में नहीं लगाया जाता)।","1 input phase missing":"1 इनपुट फ़ेज़ गायब","1 module faulty / missing":"1 मॉड्यूल खराब / गायब","1 · Upgrade fuse / CB and battery cables":"1 · फ्यूज़ / CB और बैटरी केबल अपग्रेड करें","2 · Install DCDP or fuse box":"2 · DCDP या फ्यूज़ बॉक्स लगाएँ","3 · Connect extra batteries directly to the DC busbar":"3 · एक्स्ट्रा बैटरियाँ सीधे DC बसबार से जोड़ें","> 1 input phase missing":"> 1 इनपुट फ़ेज़ गायब","> 1 module faulty / missing":"> 1 मॉड्यूल खराब / गायब","A uniform 1U (≈ 4.5 cm) gap is kept between batteries.":"बैटरियों के बीच एक जैसा 1U (≈ 4.5 cm) का गैप रखा गया है।","AC cable MDB → DC system (4 core Cu XLPE, mm²)":"AC केबल MDB → DC सिस्टम (4 कोर Cu XLPE, mm²)","AC cable glands are fitted and insulated at the MDB and DC system entry.":"MDB और DC सिस्टम की एंट्री पर AC केबल ग्लैंड लगे हैं और इंसुलेटेड हैं।","AC input":"AC इनपुट","AC input high-voltage alarm (V)":"AC इनपुट हाई-वोल्टेज अलार्म (V)","AC input low-voltage alarm (V)":"AC इनपुट लो-वोल्टेज अलार्म (V)","AC surge protection device is installed and grounded (Class I+II, ≥ 80 kA; ≥ 100 kA for 54 kW).":"AC सर्ज प्रोटेक्शन डिवाइस लगा है और ग्राउंड किया हुआ है (Class I+II, ≥ 80 kA; 54 kW के लिए ≥ 100 kA)।",Accepted:"मंज़ूर","Accepted with minor OIL":"Minor OIL के साथ मंज़ूर","Active / Major":"एक्टिव / Major","Active / Minor":"एक्टिव / Minor","Add battery":"बैटरी जोड़ें","Add every battery on this DC system: new, exist en":"MCU की AC इनपुट स्क्रीन","220/127 V site with conversion kit":"कन्वर्ज़न किट के साथ 220/127 V साइट","Measured N – E at the DC system internal main CB under load. Up to 2 V: OK. Above 2 V: Minor. Above 5 V: Major (neutral or earthing fault).":"DC सिस्टम के अंदरूनी मेन CB पर लोड के साथ नापा गया N – E। 2 V तक: OK। 2 V से ज़्यादा: Minor। 5 V से ज़्यादा: Major (न्यूट्रल या अर्थिंग की खराबी)।","Neutral – earth voltage at the DC system input is within limits (≤ 2 V).":"DC सिस्टम इनपुट पर न्यूट्रल – अर्थ वोल्टेज सीमा के अंदर है (≤ 2 V)।","Read the L1, L2 and L3 input currents on the MCU screen (AC input page). Each rectifier module must be set to a phase so that all three phases carry load.":"MCU स्क्रीन पर L1, L2 और L3 इनपुट करंट पढ़ें (AC इनपुट पेज)। हर रेक्टिफ़ायर मॉड्यूल को किसी फ़ेज़ पर सेट करना ज़रूरी है ताकि तीनों फ़ेज़ लोड लें।","Read the L1, L2 and L3 input currents on the MCU screen. Each rectifier module must be set to a phase so that all three phases carry load.":"MCU स्क्रीन पर L1, L2 और L3 इनपुट करंट पढ़ें। हर रेक्टिफ़ायर मॉड्यूल को किसी फ़ेज़ पर सेट करना ज़रूरी है ताकि तीनों फ़ेज़ लोड लें।","Rectifier modules are assigned to phases so all three input phases carry current.":"रेक्टिफ़ायर मॉड्यूल फ़ेज़ पर इस तरह सेट हैं कि तीनों इनपुट फ़ेज़ करंट लेते हैं।","All three phases carry current":"तीनों फ़ेज़ करंट ले रहे हैं","Fewer than 3 modules – not every phase can carry a module":"3 से कम मॉड्यूल – हर फ़ेज़ पर मॉड्यूल नहीं आ सकता","No current shown on any phase – read the MCU under load":"किसी फ़ेज़ पर करंट नहीं दिख रहा – MCU लोड पर पढ़ें","Enter the voltage readings (AC input page)":"वोल्टेज रीडिंग दर्ज करें (AC इनपुट पेज)","Enter the CB and cable data (AC input page)":"CB और केबल का डेटा दर्ज करें (AC इनपुट पेज)","Enter the 3 phase currents (AC input page)":"तीनों फ़ेज़ करंट दर्ज करें (AC इनपुट पेज)","Enter the MCU L1 / L2 / L3 currents (AC input page)":"MCU के L1 / L2 / L3 करंट दर्ज करें (AC इनपुट पेज)","Enter the old DC system manufacturing year":"पुराने DC सिस्टम का बनने का साल दर्ज करें","Answer the conversion kit question":"कन्वर्ज़न किट वाले सवाल का जवाब दें","Enter the N – E voltage":"N – E वोल्टेज दर्ज करें","Checklist start":"चेकलिस्ट शुरू","Checklist end":"चेकलिस्ट खत्म","Captured automatically. The end time is set when the PDF report is exported with a final result.":"अपने आप दर्ज होता है। खत्म होने का समय तब लगता है जब अंतिम नतीजे के साथ PDF रिपोर्ट एक्सपोर्ट हो।","Meter readings at the DC system internal main CB":"DC सिस्टम के अंदरूनी मेन CB पर मीटर रीडिंग","220/380V Conversion Kit Installed?":"क्या 220/380V कन्वर्ज़न किट लगी है?","Does the DC system internal main CB also feed other AC loads (AC cooling unit, fans, lights, sockets)?":"क्या DC सिस्टम का अंदरूनी मेन CB दूसरे AC लोड को भी सप्लाई देता है (AC कूलिंग यूनिट, पंखे, लाइटें, सॉकेट)?","Modules need about 220 V. On a 220/127 V site the only approved connection is the 220/380V conversion kit (phase-to-phase). A normal L-N connection gives the modules only 127 V (low output, overload and fire risk). The kit must not be used on a 380/220 V site.":"मॉड्यूल को लगभग 220 V चाहिए। 220/127 V साइट पर केवल 220/380V कन्वर्ज़न किट (फेज़-टू-फेज़) मंज़ूर है। सामान्य L-N कनेक्शन मॉड्यूल को 127 V देता है (कम पावर, ओवरलोड और आग का खतरा)। 380/220 V साइट पर किट न लगाएँ।","220/380V conversion kit is installed in a visible and accessible place, with its nameplate readable.":"220/380V कन्वर्ज़न किट ऐसी जगह लगी है जो दिखे और जहाँ पहुँचा जा सके, और उसकी नेमप्लेट पढ़ी जा सके।","Total rectifier output current shown on MCU (A) (load + battery charging)":"MCU पर दिखाया गया रेक्टिफ़ायर का कुल आउटपुट करंट (A) (लोड + बैटरी चार्जिंग)","Input power = 1.732 × L-L voltage × phase current (averages of the meter readings at the DC system internal main CB). Output power = DC output voltage × total rectifier current shown on the MCU. Efficiency = output ÷ input. Spec minimum 95 %, less 3 % meter tolerance: OK from 92 % to 100 %. Below 92 % is information only at light load (below 20 % of module capacity) or when the internal main CB also feeds other AC loads. Above 100 % means the readings do not match.":"इनपुट पावर = 1.732 × L-L वोल्टेज × फेज़ करंट (DC सिस्टम के अंदरूनी मेन CB पर मीटर रीडिंग का औसत)। आउटपुट पावर = DC आउटपुट वोल्टेज × MCU पर दिखाया गया रेक्टिफ़ायर का कुल करंट। एफ़िशिएंसी = आउटपुट ÷ इनपुट। स्पेक न्यूनतम 95 %, मीटर की सटीकता के लिए 3 % कम: 92 % से 100 % तक OK। 92 % से कम केवल जानकारी है अगर लोड हल्का हो (मॉड्यूल क्षमता के 20 % से कम) या अंदरूनी मेन CB दूसरे AC लोड को भी सप्लाई देता हो। 100 % से ज़्यादा का मतलब है कि रीडिंग आपस में मेल नहीं खातीं।","Enter the DC output voltage and total rectifier current":"DC आउटपुट वोल्टेज और रेक्टिफ़ायर का कुल करंट डालें","MCU readings (if shown)":"MCU रीडिंग (अगर दिखें)","MCU – DC output voltage (V) – optional":"MCU – DC आउटपुट वोल्टेज (V) – वैकल्पिक","MCU – total rectifier output current (A) – optional":"MCU – रेक्टिफ़ायर का कुल आउटपुट करंट (A) – वैकल्पिक","Checked only when the MCU DC output voltage and total rectifier current are entered. Input power = 1.732 × L-L voltage × phase current (meter readings). Output power = DC voltage × total rectifier current. OK from 92 % to 100 %.":"केवल तब जाँचा जाता है जब MCU का DC आउटपुट वोल्टेज और रेक्टिफ़ायर का कुल करंट डाला गया हो। इनपुट पावर = 1.732 × L-L वोल्टेज × फेज़ करंट (मीटर रीडिंग)। आउटपुट पावर = DC वोल्टेज × रेक्टिफ़ायर का कुल करंट। 92 % से 100 % तक OK।","Enter the L-L voltages and phase currents (AC input page)":"L-L वोल्टेज और फेज़ करंट डालें (AC इनपुट पेज)","Enter the MCU DC output voltage and total rectifier current (AC input page)":"MCU का DC आउटपुट वोल्टेज और रेक्टिफ़ायर का कुल करंट डालें (AC इनपुट पेज)","Answer the other AC loads question (AC input page)":"दूसरे AC लोड वाले सवाल का जवाब दें (AC इनपुट पेज)","No AC current measured – take the readings under load":"कोई AC करंट नहीं मापा गया – रीडिंग लोड के दौरान लें","Job / WO number":"जॉब / WO नंबर","Complete the required items on this page first":"पहले इस पेज के ज़रूरी आइटम पूरे करें","Type the values shown on the MCU and take the photos now. The battery rows show PASS / FAIL after you fill the Batteries page.":"MCU पर दिख रही वैल्यू अभी लिखें और फ़ोटो लें। बैटरी वाली पंक्तियाँ बैटरी पेज भरने के बाद PASS / FAIL दिखाएँगी।","Could not save – phone storage is full. Save a backup file, free some space, then continue.":"सेव नहीं हुआ – फ़ोन की स्टोरेज भरी है। बैकअप फ़ाइल सेव करें, थोड़ी जगह खाली करें, फिर जारी रखें।","AC input power and DC output power readings match (efficiency 92 – 100 %).":"AC इनपुट पावर और DC आउटपुट पावर की रीडिंग मेल खाती हैं (एफ़िशिएंसी 92 – 100 %)।","Photos and videos are allowed at this site.":"इस साइट पर फ़ोटो और वीडियो लेने की अनुमति है।","The site has lightning protection and grounding that match its lightning risk.":"साइट पर बिजली गिरने के खतरे के हिसाब से लाइटनिंग प्रोटेक्शन और ग्राउंडिंग है।","The DC system is not inside a telecom ODU, unless that ODU is approved for it.":"DC सिस्टम टेलीकॉम ODU के अंदर नहीं है, जब तक वह ODU इसके लिए मंज़ूर न हो।","% of Ah":"Ah का %","External alarm":"बाहरी अलार्म","(from battery register)":"(बैटरी रजिस्टर से)","from battery register":"बैटरी रजिस्टर से","Mixed (mostly Li-Ion)":"मिश्रित (ज़्यादातर Li-Ion)","Mixed (mostly VRLA)":"मिश्रित (ज़्यादातर VRLA)","0.2 × total Ah":"0.2 × कुल Ah","of total Ah":"कुल Ah का","Battery black box size":"बैटरी ब्लैक बॉक्स का साइज़","4-string black box":"4 बैटरी वाला ब्लैक बॉक्स (4-string)","8-string black box":"8 बैटरी वाला ब्लैक बॉक्स (8-string)","The black box is an approved model for its size.":"ब्लैक बॉक्स अपने साइज़ के लिए मंज़ूर मॉडल है।","4-string boxes: FENDA, IMAN, MASART, Dr-CUBE SAFE. 8-string boxes: OSOOL VTX-BB-PRO-8R only (other 8-string brands are still under approval).":"4 बैटरी वाले बॉक्स: FENDA, IMAN, MASART, Dr-CUBE SAFE। 8 बैटरी वाले बॉक्स: सिर्फ़ OSOOL VTX-BB-PRO-8R (बाकी ब्रांड अभी मंज़ूरी में हैं)।","The nameplate shows the approved model and the box size matches it (OSOOL 8-string: 1600 mm high plus a 150 mm base, 600 mm wide, 670 mm deep).":"नेमप्लेट पर मंज़ूर मॉडल है और बॉक्स का साइज़ उससे मेल खाता है (OSOOL 8 बैटरी: ऊँचाई 1600 mm और 150 mm बेस, चौड़ाई 600 mm, गहराई 670 mm)।","The nameplate shows the approved black box model.":"नेमप्लेट पर मंज़ूर ब्लैक बॉक्स मॉडल है।","The door closes and all 5 locking points engage (3 left, 1 top, 1 bottom), and the lock works.":"दरवाज़ा बंद होता है और लॉक के पाँचों पॉइंट लगते हैं (3 बाएँ, 1 ऊपर, 1 नीचे), और लॉक काम करता है।","The black box is anchored to the shelter floor, and the anchors cannot be removed from outside.":"ब्लैक बॉक्स शेल्टर के फ़र्श से पक्का लगा है, और उसके बोल्ट बाहर से नहीं खुल सकते।","No holes are cut or drilled in the black box. Cables pass only through the factory cable holes, with grommets.":"ब्लैक बॉक्स में कोई छेद काटा या ड्रिल नहीं किया गया। केबल सिर्फ़ फ़ैक्टरी के केबल छेदों से, ग्रोमेट के साथ जाती हैं।","Vent holes on both sides and the back are not blocked, and at least 10 cm is kept free at both sides and the back.":"दोनों तरफ़ और पीछे के हवा के छेद बंद नहीं हैं, और दोनों तरफ़ और पीछे कम से कम 10 cm जगह खाली है।","No more than 8 batteries in the 8-string black box, one battery per shelf.":"8 बैटरी वाले ब्लैक बॉक्स में 8 से ज़्यादा बैटरी नहीं, हर शेल्फ़ पर एक बैटरी।","No more than 4 batteries in each 4-string black box, one battery per shelf.":"हर 4 बैटरी वाले ब्लैक बॉक्स में 4 से ज़्यादा बैटरी नहीं, हर शेल्फ़ पर एक बैटरी।","Nothing is placed on top of the 8-string black box.":"8 बैटरी वाले ब्लैक बॉक्स के ऊपर कुछ नहीं रखा गया।","The black box is grounded to the site main grounding busbar with min. 16 mm² cable.":"ब्लैक बॉक्स कम से कम 16 mm² केबल से साइट के मेन ग्राउंडिंग बसबार से जुड़ा है।","The black box is free of damage, its paint is intact and there is no rust.":"ब्लैक बॉक्स में कोई नुकसान नहीं, पेंट ठीक है और ज़ंग नहीं है।","The black box lock code / keys are handed to the TAWAL Region team (not to the contractor or the MSP), and the factory code is changed.":"ब्लैक बॉक्स के लॉक का कोड / चाबियाँ TAWAL रीजन टीम को दी गई हैं (कॉन्ट्रैक्टर या MSP को नहीं), और फ़ैक्टरी कोड बदल दिया गया है।","Stamped certificate for the rack / black box coating (galvanizing or powder coating) and its warranty is handed over.":"रैक / ब्लैक बॉक्स की कोटिंग (गैल्वनाइज़िंग या पाउडर कोटिंग) और उसकी वारंटी का मुहर लगा सर्टिफ़िकेट दिया गया है।","This copy of the checklist is not authorised":"चेकलिस्ट की यह कॉपी अधिकृत नहीं है","Open the checklist only from the official TAWAL link.":"चेकलिस्ट सिर्फ़ TAWAL के आधिकारिक लिंक से खोलें।","Start recording":"रिकॉर्डिंग शुरू करें","Show the installation, then walk out and lock the shelter. Recording stops at 30 s.":"इंस्टॉलेशन दिखाएँ, फिर बाहर निकलें और शेल्टर पर ताला लगाएँ। रिकॉर्डिंग 30 सेकंड पर रुक जाती है।","Video recording is not supported on this phone":"इस फ़ोन पर वीडियो रिकॉर्डिंग नहीं हो सकती",Stop:"रोकें","The video is too large – record it again":"वीडियो बहुत बड़ा है – दोबारा रिकॉर्ड करें","Could not read this video":"यह वीडियो पढ़ा नहीं जा सका","Video could not be saved – phone storage is full.":"वीडियो सेव नहीं हो सका – फ़ोन की मेमोरी भरी है।","Video added":"वीडियो जोड़ दिया गया","The video is longer than 30 s – record it again":"वीडियो 30 सेकंड से लंबा है – दोबारा रिकॉर्ड करें","Closing video (max 30 s)":"समापन वीडियो (ज़्यादा से ज़्यादा 30 सेकंड)","Record it after the checklist is filled: show the installation, then walk out and lock the shelter.":"चेकलिस्ट भरने के बाद रिकॉर्ड करें: इंस्टॉलेशन दिखाएँ, फिर बाहर निकलें और शेल्टर पर ताला लगाएँ।","Record again":"दोबारा रिकॉर्ड करें","Record the closing video (required)":"समापन वीडियो रिकॉर्ड करें (ज़रूरी)","Photo resolution is too low – take it again with the phone camera":"फ़ोटो की क्वालिटी बहुत कम है – फ़ोन के कैमरे से दोबारा लें","This photo is already used for another item – take a new photo":"यह फ़ोटो पहले ही किसी और आइटम के लिए इस्तेमाल हो चुकी है – नई फ़ोटो लें","The issued WO list on this phone is out of date. Open the checklist link with internet to update it.":"इस फ़ोन पर जारी WO लिस्ट पुरानी है। इसे अपडेट करने के लिए इंटरनेट के साथ चेकलिस्ट का लिंक खोलें।","Job / WO number found on the issued WO list.":"जॉब / WO नंबर जारी WO लिस्ट में मिल गया।","This Job / WO number and TAWAL ID are not on the issued WO list. Check both numbers. If they are correct, contact TAWAL.":"यह जॉब / WO नंबर और TAWAL ID जारी WO लिस्ट में नहीं हैं। दोनों नंबर जाँचें। अगर सही हैं तो TAWAL से संपर्क करें।",Declaration:"घोषणा",Submission:"जमा करना","Upload the PDF report, the backup file and the supporting documents to the TAWAL shared folder within 24 hours of closing the checklist.":"चेकलिस्ट बंद करने के 24 घंटे के अंदर PDF रिपोर्ट, बैकअप फ़ाइल और सहायक दस्तावेज़ TAWAL के शेयर्ड फ़ोल्डर में अपलोड करें।",Deadline:"अंतिम समय","The MSP checks and signs the checklist within 24 hours of the upload.":"MSP अपलोड के 24 घंटे के अंदर चेकलिस्ट जाँचकर साइन करता है।","The MSP can claim physical damage that the time-stamped photos do not disprove only until the first PMR / CMR visit, and at most 2 months after the handover date.":"MSP ऐसे भौतिक नुकसान का दावा, जिसे टाइम-स्टैम्प वाली फ़ोटो गलत साबित न करें, सिर्फ़ पहली PMR / CMR विज़िट तक और हैंडओवर की तारीख से ज़्यादा से ज़्यादा 2 महीने तक कर सकता है।","Last day":"आखिरी दिन","Checklist size":"चेकलिस्ट का साइज़","Warning: this backup file was changed outside the checklist after it was saved.":"चेतावनी: इस बैकअप फ़ाइल को सेव करने के बाद चेकलिस्ट के बाहर बदला गया है।","I confirm that I am an authorised TAWAL implementation contractor, this is a TAWAL site, and all entries and photos are true.":"मैं पुष्टि करता हूँ कि मैं TAWAL का अधिकृत इम्प्लीमेंटेशन कॉन्ट्रैक्टर हूँ, यह TAWAL की साइट है, और सभी एंट्री और फ़ोटो सही हैं।","Yes, I confirm":"हाँ, मैं पुष्टि करता हूँ","Black box door alarm is reported at the TOC (open the door and confirm with the TOC).":"ब्लैक बॉक्स के दरवाज़े का अलार्म TOC पर आता है (दरवाज़ा खोलें और TOC से पुष्टि करें)।","The door alarm goes directly to the TOC; it does not show on the MCU. If the TOC does not receive it (for example a site link problem), answer NOK: it is recorded as an MSP snag and the MSP verifies it when they receive the checklist. No trouble ticket is needed.":"दरवाज़े का अलार्म सीधे TOC को जाता है; यह MCU पर नहीं दिखता। अगर TOC को न मिले (जैसे साइट लिंक की समस्या), तो NOK जवाब दें: यह MSP के ज़िम्मे दर्ज होता है और MSP चेकलिस्ट मिलने पर इसकी पुष्टि करता है। ट्रबल टिकट (TT) की ज़रूरत नहीं।","All photos were taken within 100 m of the site location (from the issued WO list).":"सभी फ़ोटो साइट की लोकेशन से 100 m के अंदर ली गईं (जारी WO लिस्ट के अनुसार)।","Closing video (max 30 s): the installation, then leaving and locking the shelter":"समापन वीडियो (ज़्यादा से ज़्यादा 30 सेकंड): इंस्टॉलेशन, फिर बाहर निकलना और शेल्टर पर ताला लगाना","S/N label photo":"S/N लेबल की फ़ोटो","Checking the issued WO list":"जारी WO लिस्ट जाँची जा रही है","Not on the issued WO list for this TAWAL ID – contact TAWAL":"इस TAWAL ID के लिए जारी WO लिस्ट में नहीं – TAWAL से संपर्क करें","Does not match the issued WO":"जारी WO से मेल नहीं खाता","Compatible cable already available at MC / district":"अनुकूल केबल पहले से MC / डिस्ट्रिक्ट में मौजूद है","© 2026 TAWAL. Property of TAWAL – for authorised contractors on TAWAL sites only. Each report records the device, job and time.":"© 2026 TAWAL. TAWAL की संपत्ति – सिर्फ़ TAWAL साइटों पर अधिकृत कॉन्ट्रैक्टरों के लिए। हर रिपोर्ट में डिवाइस, जॉब और समय दर्ज होता है।",Scope:"काम का दायरा","PAT date":"PAT की तारीख","Filled from the TAWAL critical site list.":"TAWAL की क्रिटिकल साइट लिस्ट से भरा गया।","Not on the TAWAL critical site list.":"TAWAL की क्रिटिकल साइट लिस्ट में नहीं।","Does not match the TAWAL critical site list":"TAWAL की क्रिटिकल साइट लिस्ट से मेल नहीं खाता","The backup matches its saved integrity code. This check does not verify who created or edited it.":"बैकअप अपने सेव किए गए integrity कोड से मेल खाता है। यह जाँच यह नहीं बताती कि इसे किसने बनाया या बदला।","Problems in the work of the implementer (the contractor who did this job). They decide the result.":"इम्प्लीमेंटर (जिस ठेकेदार ने यह काम किया) के काम में कमियाँ। नतीजा इन्हीं से तय होता है।","Major = serious defect. Minor = small defect.":"Major = गंभीर कमी। Minor = छोटी कमी।","Problems on equipment that was already on site. The MSP (the O&M company) owns them. They do not change the implementer result.":"साइट पर पहले से मौजूद उपकरण की कमियाँ। इनकी ज़िम्मेदारी MSP (O&M कंपनी) की है। ये इम्प्लीमेंटर के नतीजे को नहीं बदलतीं।","Filled from the issued WO list.":"जारी WO सूची से भरा गया।","Handover date cannot be in the future":"हैंडओवर की तारीख भविष्य की नहीं हो सकती","Serious problem on existing equipment (MSP · Major). It does not change your result, but tell the MSP before you leave the site.":"पहले से लगे उपकरण में गंभीर कमी (MSP · Major)। इससे आपका नतीजा नहीं बदलता, लेकिन साइट छोड़ने से पहले MSP को बताएँ।","Serious problem on existing equipment (MSP · Major) – the MSP must fix it before this handover can close":"पहले से लगे उपकरण में गंभीर कमी (MSP · Major) – यह हैंडओवर बंद होने से पहले MSP इसे ठीक करे"},fil:{"The DC system size is allowed in an outdoor cabinet (54 kW is not installed in an ODU / ODC).":"Pinapayagan ang laki ng DC system sa outdoor cabinet (hindi inilalagay ang 54 kW sa ODU / ODC).","1 input phase missing":"1 input phase ang nawawala","1 module faulty / missing":"1 module ang sira / nawawala","1 · Upgrade fuse / CB and battery cables":"1 · I-upgrade ang fuse / CB at mga battery cable","2 · Install DCDP or fuse box":"2 · Mag-install ng DCDP o fuse box","3 · Connect extra batteries directly to the DC busbar":"3 · Ikabit ang mga dagdag na battery diretso sa DC busbar","> 1 input phase missing":"> 1 input phase ang nawawala","> 1 module faulty / missing":"> 1 module ang sira / nawawala","A uniform 1U (≈ 4.5 cm) gap is kept between batteries.":"May pare-parehong 1U (≈ 4.5 cm) na pagitan ang bawat battery.","AC cable MDB → DC system (4 core Cu XLPE, mm²)":"AC cable MDB → DC system (4 core Cu XLPE, mm²)","AC cable glands are fitted and insulated at the MDB and DC system entry.":"Nakakabit at naka-insulate ang mga AC cable gland sa pasukan ng MDB at DC system.","AC input":"AC input","AC input high-voltage alarm (V)":"High-voltage alarm ng AC input (V)","AC input low-voltage alarm (V)":"Low-voltage alarm ng AC input (V)","AC surge protection device is installed and grounded (Class I+II, ≥ 80 kA; ≥ 100 kA for 54 kW).":"Naka-install at naka-ground ang AC surge protection device (Class I+II, ≥ 80 kA; ≥ 100 kA para sa 54 kW).",Accepted:"Tanggap","Accepted with minor OIL":"Tanggap na may Minor OIL","Active / Major":"Aktibo / Major","Active / Minor":"Aktibo / Minor","Add battery":"Magdagdag ng battery","Add every battery on this DC system: new, existing and removed.":"Idagdag ang bawat battery sa DC system na ito: bago, dati na, at tinanggal.","Add several identical":"Magdagdag ng ilang magkakapareho","Air-conditioning is working and the ambient temperature is within 25 °C ± 5 °C.":"Gumagana ang aircon at ang ambient temperature ay nasa 25 °C ± 5 °C.","Alarms & handover":"Mga alarm at handover","All battery fuses / CBs report an external alarm when switched off or removed.":"Lahat ng battery fuse / CB ay nagbibigay ng external alarm kapag pinatay o tinanggal.","All cables are connected with lugs and heat-shrink (no pins or direct connections).":"Lahat ng cable ay nakakabit gamit ang lug at heat-shrink (walang pin o direktang koneksyon).","All cables enter the DC system from the top (no side entry).":"Lahat ng cable ay pumapasok sa DC system mula sa itaas (walang pasok sa gilid).","All checks passed":"Pasado lahat ng check","All connected batteries have the same rated capacity (Ah).":"Pare-pareho ang rated capacity (Ah) ng lahat ng nakakabit na battery.","All empty module slots are fitted with dummy (blank) covers.":"Lahat ng bakanteng module slot ay may dummy (blank) cover.","All empty module slots are tested and functional.":"Lahat ng bakanteng module slot ay na-test at gumagana.","All external alarms (DC system and batteries) are tested and received at TOC.":"Lahat ng external alarm (DC system at mga battery) ay na-test at natatanggap sa TOC.","All new cable ends are crimped with lugs and heat-shrink.":"Lahat ng bagong dulo ng cable ay naka-crimp na may lug at heat-shrink.","All old equipment (DC system, batteries, racks, cables, accessories) is removed from the site.":"Lahat ng lumang equipment (DC system, battery, rack, cable, accessories) ay tinanggal na sa site.","All power cables are labelled at both ends.":"Lahat ng power cable ay may label sa magkabilang dulo.","Anti-Theft":"Anti-Theft","Anti-theft (gyroscope) is auto-activated on connection; unlock only with the L2 password.":"Kusang nag-a-activate ang anti-theft (gyroscope) pagkakonekta; i-unlock lang gamit ang L2 password.","Are there empty module slots?":"May bakanteng module slot ba?","At least two (2) batteries are connected.":"Hindi bababa sa dalawang (2) battery ang nakakabit.","B2S (new site)":"B2S (bagong site)","BB Internal CB off":"BB Internal CB naka-off","BMS Malfunction":"BMS Malfunction","BMS alarm & protection table":"Talaan ng BMS alarm at protection","BMS alarm and protection settings match the TAWAL table.":"Tugma ang BMS alarm at protection settings sa TAWAL table.","BMS communicates with the MCU (battery SOC is shown on the MCU).":"Nakakausap ng BMS ang DC controller (nakikita ang battery SOC sa MCU).","BMS date and time are set to Riyadh time (GMT+3).":"Naka-set ang petsa at oras ng BMS sa oras ng Riyadh (GMT+3).","BMS event log capacity ≥ 2000 events (readings not counted) – info only.":"BMS event log capacity ≥ 2000 events (hindi kasama ang readings) – impormasyon lang.","Backup opened":"Nabuksan ang backup","Backup target for this customer":"Backup target para sa customer na ito","Backup time":"Backup time",Batteries:"Mga battery","Batteries are distributed on fuses / CBs per the TAWAL guideline.":"Nakahati ang mga battery sa mga fuse / CB ayon sa TAWAL guideline.","Batteries are fixed to the black box body wit  sa TOC).","The door alarm goes directly to the TOC; it does not show on the MCU. If the TOC does not receive it (for example a site link problem), answer NOK: it is recorded as an MSP snag and the MSP verifies it when they receive the checklist. No trouble ticket is needed.":"Direktang napupunta sa TOC ang door alarm; hindi ito lumalabas sa MCU. Kung hindi ito natanggap ng TOC (halimbawa, problema sa link ng site), sagutin ng NOK: itatala ito bilang snag ng MSP at susuriin ng MSP pagkatanggap ng checklist. Hindi kailangan ng trouble ticket (TT).","All photos were taken within 100 m of the site location (from the issued WO list).":"Lahat ng larawan ay kinunan sa loob ng 100 m mula sa lokasyon ng site (ayon sa listahan ng inilabas na WO).","Closing video (max 30 s): the installation, then leaving and locking the shelter":"Closing video (hanggang 30 s): ang installation, saka paglabas at pag-lock ng shelter","S/N label photo":"Larawan ng S/N label","Checking the issued WO list":"Sinusuri ang listahan ng inilabas na WO","Not on the issued WO list for this TAWAL ID – contact TAWAL":"Wala sa listahan ng inilabas na WO para sa TAWAL ID na ito – tumawag sa TAWAL","Does not match the issued WO":"Hindi tugma sa inilabas na WO","Compatible cable already available at MC / district":"May tugmang cable na sa MC / district","© 2026 TAWAL. Property of TAWAL – for authorised contractors on TAWAL sites only. Each report records the device, job and time.":"© 2026 TAWAL. Pag-aari ng TAWAL – para lang sa mga awtorisadong contractor sa mga site ng TAWAL. Itinatala ng bawat report ang device, job at oras.",Scope:"Saklaw ng trabaho","PAT date":"Petsa ng PAT","Filled from the TAWAL critical site list.":"Kinuha mula sa listahan ng critical site ng TAWAL.","Not on the TAWAL critical site list.":"Wala sa listahan ng critical site ng TAWAL.","Does not match the TAWAL critical site list":"Hindi tugma sa listahan ng critical site ng TAWAL","The backup matches its saved integrity code. This check
